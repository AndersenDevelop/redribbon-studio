<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedRibbon Studio — Демо АТС</title>
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #18181c;
            --accent: #e63946;
            --text-main: #f1f1f1;
            --text-dim: #a0a0aa;
            --border: #2a2a32;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 30px 20px;
            text-align: center;
            background: linear-gradient(180deg, #1f080a 0%, var(--bg-color) 100%);
            border-bottom: 1px solid var(--border);
        }

        h1 { color: var(--accent); margin: 0; font-size: 2rem; }

        .container {
            max-width: 800px;
            width: 90%;
            margin: 30px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .card h2 { margin-top: 0; border-bottom: 2px solid var(--accent); padding-bottom: 8px; font-size: 1.2rem; }

        .project-item {
            background: #222228;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tag { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: var(--accent); font-weight: bold; }

        /* Мобильный интерфейс звонка */
        .call-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #141418;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .screen {
            width: 100%;
            background: #09090b;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
            text-align: center;
            min-height: 80px;
            margin-bottom: 15px;
        }

        .screen-status { font-size: 0.75rem; color: var(--accent); text-transform: uppercase; font-weight: bold; }
        .screen-text { font-size: 0.9rem; margin-top: 6px; color: var(--text-main); }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 240px;
        }

        .num-btn {
            background: #25252c;
            border: 1px solid var(--border);
            color: white;
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
        }
        .num-btn:active { background: var(--accent); }

        .call-actions {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 240px;
            margin-top: 15px;
        }

        .btn-call { flex: 1; background: #2a9d8f; border: none; color: white; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-hangup { flex: 1; background: var(--accent); border: none; color: white; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>REDRIBBON STUDIO</h1>
        <p style="color: var(--text-dim);">Платформа проектов и демо облачной АТС</p>
    </header>

    <div class="container">
        <!-- Левая часть: Проекты -->
        <div class="card">
            <h2>Проекты студии</h2>
            <div class="project-item">
                <div><strong>SanTrope Vanilla</strong><br><small style="color: var(--text-dim);">Главный админ #1</small></div>
                <span class="tag">ONLINE</span>
            </div>
            <div class="project-item">
                <div><strong>BaseCom Messenger</strong><br><small style="color: var(--text-dim);">Разработка</small></div>
                <span class="tag" style="background: #e9c46a; color: black;">BETA</span>
            </div>
            <div class="project-item">
                <div><strong>«Застывший взгляд Аски»</strong><br><small style="color: var(--text-dim);">Визуальная новелла</small></div>
                <span class="tag" style="background: #2a9d8f;">DEV</span>
            </div>
        </div>

        <!-- Правая часть: Рабочий виджет АТС -->
        <div class="card call-container">
            <h2>Поддержка АТС</h2>
            
            <div class="screen">
                <div id="status" class="screen-status">Готов к вызову</div>
                <div id="display" class="screen-text">Нажмите «Вызов» для соединения</div>
            </div>

            <div class="numpad">
                <button class="num-btn" onclick="pressKey('1')">1</button>
                <button class="num-btn" onclick="pressKey('2')">2</button>
                <button class="num-btn" onclick="pressKey('3')">3</button>
                <button class="num-btn" onclick="pressKey('4')">4</button>
                <button class="num-btn" onclick="pressKey('5')">5</button>
                <button class="num-btn" onclick="pressKey('6')">6</button>
                <button class="num-btn" onclick="pressKey('7')">7</button>
                <button class="num-btn" onclick="pressKey('8')">8</button>
                <button class="num-btn" onclick="pressKey('9')">9</button>
                <button class="num-btn" onclick="pressKey('*')">*</button>
                <button class="num-btn" onclick="pressKey('0')">0</button>
                <button class="num-btn" onclick="pressKey('#')">#</button>
            </div>

            <div class="call-actions">
                <button class="btn-call" onclick="startCall()">📞 Вызов</button>
                <button class="btn-hangup" onclick="endCall()">❌ Сброс</button>
            </div>
        </div>
    </div>

    <!-- Скрытый аудиоэлемент для фоновой музыки ожидания -->
    <audio id="holdMusic" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

    <script>
        let inCall = false;
        let inputBuffer = "";
        let holdLoopTimer = null;
        const PIN = "1337";

        function updateScreen(status, text) {
            document.getElementById('status').innerText = status;
            document.getElementById('display').innerText = text;
        }

        function speak(text, callback) {
            window.speechSynthesis.cancel();
            if (!inCall) return;
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'ru-RU';
            utter.rate = 1.0;
            if (callback) utter.onend = callback;
            window.speechSynthesis.speak(utter);
        }

        function startCall() {
            inCall = true;
            inputBuffer = "";
            document.getElementById('holdMusic').pause();
            clearInterval(holdLoopTimer);

            updateScreen("Соединение...", "Вызов принят. Автоответчик запущен...");
            
            speak("Здравствуйте! Вы позвонили в студию RedRibbon. Нажмите 1 для связи по игре СанТропе, 2 по мессенджеру БейсКом, 3 по новелле, 4 по вопросам рекламы.");
        }

        function endCall() {
            inCall = false;
            inputBuffer = "";
            window.speechSynthesis.cancel();
            document.getElementById('holdMusic').pause();
            clearInterval(holdLoopTimer);
            updateScreen("Звонок завершен", "Линия свободна");
        }

        function pressKey(key) {
            if (!inCall) return;
            inputBuffer += key;

            // Сброс зацикленной музыки ожидания при новом нажатии
            document.getElementById('holdMusic').pause();
            clearInterval(holdLoopTimer);

            if (inputBuffer === "1") {
                updateScreen("Ветка: SanTrope", "Переключение на Главного Админа...");
                speak("Соединяем с администрацией SanTrope Vanilla.", startHoldQueue);
            } 
            else if (inputBuffer === "2") {
                updateScreen("Ветка: BaseCom", "Переключение на отдел разработки...");
                speak("Отдел разработки BaseCom.", startHoldQueue);
            } 
            else if (inputBuffer === "3") {
                updateScreen("Ветка: Новелла", "Проект «Застывший взгляд Аски»...");
                speak("Команда визуальной новеллы Застывший взгляд Аски.", startHoldQueue);
            } 
            else if (inputBuffer === "4") {
                updateScreen("Ветка: Реклама", "Отдел сотрудничества и PR...");
                speak("Отдел рекламы и PR.", startHoldQueue);
            } 
            else if (inputBuffer === "9") {
                updateScreen("Служебный доступ", "Введите PIN-код и нажмите #");
                speak("Введите пин код сотрудников.");
            } 
            else if (inputBuffer.endsWith("#")) {
                let code = inputBuffer.replace("#", "").trim();
                if (code.endsWith(PIN)) {
                    updateScreen("Служебная линия", "Авторизация успешна! Связь с офисом.");
                    speak("Доступ разрешен. Добро пожаловать на служебную линию.");
                } else {
                    updateScreen("Ошибка", "Неверный PIN-код!");
                    speak("Неверный пин код. Попробуйте снова.");
                    inputBuffer = "";
                }
            }
        }

        // Функция бесконечной очереди ожидания с музыкой и повтором фразы
        function startHoldQueue() {
            if (!inCall) return;
            
            // Включаем фоновую музыку
            const music = document.getElementById('holdMusic');
            music.currentTime = 0;
            music.play().catch(e => console.log("Автозапуск аудио заблокирован браузером до клика"));

            updateScreen("Ожидание оператора", "Все операторы заняты, пожалуйста ожидайте...");
            
            // Запускаем бесконечный цикл голосового предупреждения каждые 7 секунд
            holdLoopTimer = setInterval(() => {
                if (!inCall) {
                    clearInterval(holdLoopTimer);
                    return;
                }
                speak("Все операторы заняты, пожалуйста ожидайте.");
            }, 7000);
        }
    </script>
</body>
</html>
