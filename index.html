<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedRibbon Studio — Cloud Telecom & Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-grad: linear-gradient(135deg, #0a0a0c 0%, #16080a 50%, #08080a 100%);
            --card-bg: rgba(22, 22, 28, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-red: #ff2a4b;
            --accent-red-glow: rgba(255, 42, 75, 0.4);
            --accent-green: #00e676;
            --accent-gold: #ffb703;
            --text-main: #ffffff;
            --text-muted: #8e8e9e;
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-grad);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 40px 20px 20px;
            text-align: center;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ffffff, var(--accent-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 6px;
        }

        .container {
            width: 92%;
            max-width: 960px;
            margin: 20px auto 40px;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 24px;
        }

        @media (max-width: 820px) {
            .container { grid-template-columns: 1fr; }
        }

        /* Glassmorphism Карточки */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-title::after {
            content: '';
            height: 2px;
            flex-grow: 1;
            margin-left: 15px;
            background: linear-gradient(90deg, var(--accent-red), transparent);
        }

        /* Список проектов */
        .project-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, border-color 0.2s;
        }

        .project-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 42, 75, 0.3);
        }

        .project-info h4 { margin: 0 0 4px 0; font-size: 1.05rem; }
        .project-info p { margin: 0; font-size: 0.85rem; color: var(--text-muted); }

        .badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .badge-online { background: rgba(0, 230, 118, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .badge-beta { background: rgba(255, 183, 3, 0.15); color: var(--accent-gold); border: 1px solid var(--accent-gold); }
        .badge-dev { background: rgba(255, 42, 75, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }

        /* Дисплей АТС */
        .ats-display {
            background: #050507;
            border: 1px solid rgba(255, 42, 75, 0.2);
            border-radius: 14px;
            padding: 18px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            margin-right: 6px;
        }
        .status-active { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
        .status-call { background: var(--accent-red); box-shadow: 0 0 8px var(--accent-red); animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .ats-status-text { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .ats-screen-text { font-size: 0.95rem; margin-top: 8px; color: var(--text-main); font-weight: 500; min-height: 40px; display: flex; align-items: center; justify-content: center; }

        /* Клавиатура */
        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 280px;
            margin: 0 auto;
        }

        .btn-num {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-size: 1.2rem;
            font-weight: 600;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-num:active {
            background: var(--accent-red);
            box-shadow: 0 0 12px var(--accent-red-glow);
            transform: scale(0.95);
        }

        /* Кнопки вызова */
        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            max-width: 280px;
            margin: 16px auto 0;
        }

        .btn-action {
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-start {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.3);
        }

        .btn-stop {
            background: linear-gradient(135deg, #ff0844, #ffb199);
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 8, 68, 0.3);
        }

        .btn-action:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <header>
        <div class="logo">REDRIBBON STUDIO</div>
        <div class="subtitle">Интерактивный портал & Облачная АТС</div>
    </header>

    <div class="container">
        <!-- Список проектов -->
        <div class="card">
            <h3 class="card-title">Наши Проекты</h3>
            
            <div class="project-card">
                <div class="project-info">
                    <h4>SanTrope Vanilla</h4>
                    <p>Игровой сервер #1 • Главный Админ</p>
                </div>
                <span class="badge badge-online">Online</span>
            </div>

            <div class="project-card">
                <div class="project-info">
                    <h4>BaseCom Messenger</h4>
                    <p>Безопасный мессенджер</p>
                </div>
                <span class="badge badge-beta">Beta</span>
            </div>

            <div class="project-card">
                <div class="project-info">
                    <h4>«Застывший взгляд Аски»</h4>
                    <p>Визуальная новелла</p>
                </div>
                <span class="badge badge-dev">In Dev</span>
            </div>
        </div>

        <!-- Виджет АТС -->
        <div class="card">
            <h3 class="card-title">Голосовая АТС</h3>
            
            <div class="ats-display">
                <div class="ats-status-text">
                    <span id="dot" class="status-indicator"></span>
                    <span id="status-text">Ожидание вызова</span>
                </div>
                <div id="screen-text" class="ats-screen-text">Нажмите «Вызов» для связи</div>
            </div>

            <div class="numpad-grid">
                <button class="btn-num" onclick="pressKey('1')">1</button>
                <button class="btn-num" onclick="pressKey('2')">2</button>
                <button class="btn-num" onclick="pressKey('3')">3</button>
                <button class="btn-num" onclick="pressKey('4')">4</button>
                <button class="btn-num" onclick="pressKey('5')">5</button>
                <button class="btn-num" onclick="pressKey('6')">6</button>
                <button class="btn-num" onclick="pressKey('7')">7</button>
                <button class="btn-num" onclick="pressKey('8')">8</button>
                <button class="btn-num" onclick="pressKey('9')">9</button>
                <button class="btn-num" onclick="pressKey('*')">*</button>
                <button class="btn-num" onclick="pressKey('0')">0</button>
                <button class="btn-num" onclick="pressKey('#')">#</button>
            </div>

            <div class="action-row">
                <button class="btn-action btn-start" onclick="startCall()">📞 Вызов</button>
                <button class="btn-action btn-stop" onclick="endCall()">❌ Сброс</button>
            </div>
        </div>
    </div>

    <!-- АУДИОФАЙЛЫ В КОРНЕ РЕПОЗИТОРИЯ -->
    <audio id="audioWelcome" src="welcome.mp3"></audio>
    <audio id="audioBusy" src="busy.mp3"></audio>
    <audio id="audioHoldMusic" src="hold.mp3"></audio>

    <script>
        let inCall = false;
        let inputBuffer = "";
        const PIN = "1337"; // Пин-код для служебной линии

        const audioWelcome = document.getElementById('audioWelcome');
        const audioBusy = document.getElementById('audioBusy');
        const audioHoldMusic = document.getElementById('audioHoldMusic');

        function setStatus(text, isActiveCall) {
            document.getElementById('status-text').innerText = text;
            const dot = document.getElementById('dot');
            dot.className = 'status-indicator ' + (isActiveCall ? 'status-call' : 'status-active');
        }

        function setScreenText(text) {
            document.getElementById('screen-text').innerText = text;
        }

        // Остановка всех звуковых потоков
        function stopAllAudio() {
            [audioWelcome, audioBusy, audioHoldMusic].forEach(a => {
                a.pause();
                a.currentTime = 0;
                a.onended = null; // Отменяем зацикленные подписки
            });
        }

        // Запуск звонка
        function startCall() {
            inCall = true;
            inputBuffer = "";
            stopAllAudio();
            setStatus("Звонок активен", true);
            setScreenText("Приветствуем в RedRibbon Studio! Выберите ветку...");

            // Воспроизводим приветственное сообщение welcome.mp3 из корня
            audioWelcome.play().catch(e => {
                setScreenText("Ошибка: Убедитесь, что welcome.mp3 загружен в корень");
            });
        }

        // Завершение звонка
        function endCall() {
            inCall = false;
            inputBuffer = "";
            stopAllAudio();
            setStatus("Линия свободна", false);
            setScreenText("Нажмите «Вызов» для связи");
        }

        // Нажатие на кнопки Numpad
        function pressKey(key) {
            if (!inCall) return;
            inputBuffer += key;

            stopAllAudio(); // Прерываем текущий звук при вводе команды

            if (inputBuffer === "1") {
                setScreenText("Ветка SanTrope Vanilla");
                startHoldCycle();
            } else if (inputBuffer === "2") {
                setScreenText("Ветка BaseCom Messenger");
                startHoldCycle();
            } else if (inputBuffer === "3") {
                setScreenText("Ветка «Застывший взгляд Аски»");
                startHoldCycle();
            } else if (inputBuffer === "4") {
                setScreenText("Отдел Рекламы и PR");
                startHoldCycle();
            } else if (inputBuffer === "9") {
                setScreenText("Введите PIN-код и нажмите #");
            } else if (inputBuffer.endsWith("#")) {
                let code = inputBuffer.replace("#", "").trim();
                if (code.endsWith(PIN)) {
                    setScreenText("Служебная линия. Доступ разрешен!");
                } else {
                    setScreenText("Неверный PIN-код!");
                    inputBuffer = "";
                }
            }
        }

        // Зацикленная цепочка ожидания: Голос ➔ Музыка ➔ Голос ➔ Музыка
        function startHoldCycle() {
            if (!inCall) return;

            setScreenText("Все операторы заняты. Пожалуйста, ожидайте...");

            // 1. Запускаем ваш голос busy.mp3
            audioBusy.play().catch(e => console.log("Файл busy.mp3 не найден в корне"));

            // 2. По завершению голоса включаем музыку hold.mp3
            audioBusy.onended = function() {
                if (!inCall) return;
                audioHoldMusic.play().catch(e => console.log("Файл hold.mp3 не найден в корне"));
            };

            // 3. По завершению музыки снова запускаем весь цикл
            audioHoldMusic.onended = function() {
                if (!inCall) return;
                startHoldCycle();
            };
        }
    </script>
</body>
</html>
